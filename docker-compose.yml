services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_PATH: /app/data/chalk.db
    volumes:
      - chalk-data:/app/data
    restart: unless-stopped

volumes:
  chalk-data:
